<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WS Echo Client</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; max-width: 820px; margin: 24px auto; padding: 0 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input { flex: 1; min-width: 200px; padding: 6px; }
    button { padding: 6px 10px; cursor: pointer; }
    #status { font-weight: bold; }
    #log { border: 1px solid #ccc; height: 420px; overflow-y: auto; padding: 8px; white-space: pre-wrap; font-size: 13px; }
    .out { color: #0057b8; } .in { color: #107c10; } .sys { color: #777; } .err { color: #c50f1f; }
  </style>
</head>
<body>
  <h2>Phase 1 — WebSocket Echo</h2>
  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
    <span>Status: <span id="status">closed</span></span>
  </div>
  <div class="row">
    <input id="text" value="hello">
    <button id="sendJson">Send JSON</button>
    <button id="sendBinary">Send binary</button>
    <button id="sendMalformed">Send malformed</button>
    <button id="sendTooBig">Send oversized</button>
  </div>
  <div id="log"></div>

  <script>
    const logBox = document.getElementById("log");
    const statusLabel = document.getElementById("status");
    const textInput = document.getElementById("text");
    let socket = null;

    function log(kind, text) {
      const line = document.createElement("div");
      line.className = kind;
      line.textContent = `${new Date().toLocaleTimeString()} ${text}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function isOpen() {
      if (socket && socket.readyState === WebSocket.OPEN) return true;
      log("err", "not connected");
      return false;
    }

    function connect() {
      if (socket && socket.readyState <= WebSocket.OPEN) return;
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      socket = new WebSocket(`${scheme}://${location.host}/ws`);
      socket.binaryType = "arraybuffer";
      statusLabel.textContent = "connecting";

      socket.onopen = () => { statusLabel.textContent = "open"; log("sys", "connected"); };
      socket.onerror = () => log("err", "socket error");
      socket.onclose = (event) => {
        statusLabel.textContent = "closed";
        log("sys", `closed code=${event.code} reason="${event.reason}" clean=${event.wasClean}`);
      };
      socket.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          const bytes = Array.from(new Uint8Array(event.data)).map((b) => b.toString(16).padStart(2, "0"));
          log("in", `← binary [${bytes.join(" ")}]`);
          return;
        }
        log("in", `← ${event.data}`);
      };
    }

    function send(payload, description) {
      if (!isOpen()) return;
      socket.send(payload);
      log("out", `→ ${description}`);
    }

    document.getElementById("connect").onclick = connect;
    document.getElementById("disconnect").onclick = () => socket && socket.close(1000, "bye");
    document.getElementById("sendJson").onclick = () => {
      const payload = JSON.stringify({ message: textInput.value });
      send(payload, payload);
    };
    document.getElementById("sendBinary").onclick = () => {
      const bytes = new TextEncoder().encode(textInput.value);
      send(bytes, `binary (${bytes.length} bytes)`);
    };
    document.getElementById("sendMalformed").onclick = () => send('{"message":', '{"message":');
    document.getElementById("sendTooBig").onclick = () => send("x".repeat(5000), "5000-byte text");
  </script>
</body>
</html>
