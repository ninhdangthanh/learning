version: v2
plugins:
  - local: protoc-gen-go
    out: server/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: server/gen
    opt: paths=source_relative
  - local: ./web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
  - local: ./web/node_modules/.bin/protoc-gen-connect-es
    out: web/src/gen
    opt: target=ts
